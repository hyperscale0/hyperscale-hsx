name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      # alpha.1 published a `bin` pointing at TypeScript, so every install got
      # a node_modules/.bin link Node refused to run. This asserts the built
      # target exists, is .js, and carries the node shebang.
      - name: Every bin target is node-executable
        run: bun scripts/check-bin.ts

      # The CLI is the surface most likely to break without a test noticing,
      # so CI exercises both subcommands against a real file, and pins the
      # exit code of the example that is refused on purpose.
      - name: Exercise the CLI
        run: |
          bun bin/hsx.ts --version
          bun bin/hsx.ts check examples/04-complete-product/study-hall.hsx
          bun bin/hsx.ts build examples/04-complete-product/study-hall.hsx --out /tmp/ir.json
          test -s /tmp/ir.json
          if bun bin/hsx.ts check examples/03-diagnostics/corner-shop.hsx; then
            echo "the diagnostics example must be refused" >&2
            exit 1
          fi

      - name: Pack
        run: bun pm pack --dry-run

  Editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Package editor
        working-directory: editors/vscode
        run: bunx @vscode/vsce package --no-dependencies --out hsx.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: hsx-vscode-extension
          path: editors/vscode/hsx.vsix

name: Publish

# Publishing is a release, not a push: cut a GitHub release and this runs.
on:
  release:
    types: [published]

permissions:
  id-token: write # mint the OIDC token npm trusted publishing exchanges
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # GitHub-hosted: trusted publishing and provenance both require it
    steps:
      - uses: actions/checkout@v4

      # prepack runs `bun run build` and rewrites the manifest's entry points,
      # so the publish job needs Bun even though npm does the publishing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing landed in npm 11.5.1. Node 24 ships an older 11.x,
      # so pin the floor rather than trust the bundled version.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile

      - run: bun run check

      # No NODE_AUTH_TOKEN and no NPM_TOKEN secret anywhere: the registry
      # trusts this workflow file by name, and the OIDC token is minted per run.
      # No --provenance flag either: npm refuses it while the source repository
      # is private (E422), and attaches provenance on its own once it is public.
      #
      # `latest` is passed explicitly rather than left to npm's default. npm
      # refuses to publish a prerelease under the default tag (publish.js
      # checks `isDefaultTag`), and moving a dist-tag after the fact needs an
      # interactive 2FA code. Publishing straight to `latest` keeps a bare
      # `npm install` on the newest release with no manual step.
      - name: Publish
        run: npm publish --tag latest --access public

      # Best effort: the OIDC token authenticates `npm publish`, not dist-tag
      # writes. When the registry refuses it, `latest` is already correct and
      # only the `@alpha` alias lags.
      - name: Point the alpha tag at this release
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add "$PKG@$VERSION" alpha \
            || echo "alpha tag not set (needs account auth); latest is correct"

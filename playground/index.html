        <h1 class="title">HSX playground</h1>
        <span id="verdict-badge" class="badge badge-idle">Ready</span>
      </div>
      <div class="toolbar-actions">
        <label for="examples-select" class="select-label">Example:</label>
        <select id="examples-select" class="select-input">
          <option value="">Choose an example...</option>
        </select>
      </div>
    </header>

    <main class="workspace" aria-label="Compile HSX source">
      <section class="pane pane-editor">
        <div class="pane-header">
          <span class="pane-title">Source</span>
        </div>
        <div class="editor-wrap">
          <div id="line-gutter" class="gutter" aria-hidden="true">1</div>
          <textarea
            id="source-editor"
            class="editor"
            aria-label="HSX source"
            spellcheck="false"
            placeholder="Enter HSX source here..."
          ></textarea>
        </div>
      </section>

      <section class="pane pane-output">
        <div class="pane-header tabs-header">
          <div class="tabs">
            <button id="tab-udl-btn" class="tab-btn active" type="button">
              Canonical UDL
            </button>
            <button id="tab-cost-btn" class="tab-btn" type="button">
              Cost manifest
            </button>
          </div>
        </div>
        <div class="output-wrap">
          <div id="tab-udl-content" class="tab-panel active">
            <pre><code id="udl-output"></code></pre>
          </div>
          <div id="tab-cost-content" class="tab-panel">
            <pre><code id="cost-output"></code></pre>
          </div>
        </div>
      </section>
    </main>

    <footer class="diagnostics-panel">
      <div class="diagnostics-header">
        <span class="diagnostics-title">Diagnostics</span>
        <span id="diagnostics-count" class="diagnostics-count">0 issues</span>
      </div>
      <div class="diagnostics-scroll">
        <table class="diagnostics-table">
          <thead>
            <tr>
              <th class="col-stage">Stage</th>
              <th class="col-code">Code</th>
              <th class="col-pos">Line:Col</th>
              <th class="col-message">Message</th>
              <th class="col-fix">Fix</th>
            </tr>
          </thead>
          <tbody id="diagnostics-list">
            <tr>
              <td colspan="5" class="diagnostic-empty">
                Choose an example or enter source to compile.
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      </p>
    </footer>

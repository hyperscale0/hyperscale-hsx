<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HSX 4 playground</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>HSX 4 playground</h1>
      <p>
        Edit a program and compile it locally. No source leaves this browser.
      </p>
      <label for="source">Program</label
      ><textarea id="source" spellcheck="false"></textarea
      ><button id="compile" type="button">Compile</button>
      <pre id="tokens" aria-label="Highlighted program"></pre>
      <pre id="explanation" aria-live="polite"></pre>
      <p id="status" role="status"></p>
      <pre
        id="output"
        tabindex="0"
        aria-label="Compiled document or diagnostics"
      ></pre>
    </main>
    <script type="module" src="bundle.js"></script>
  </body>
</html>
